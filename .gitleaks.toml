# Configuración de gitleaks (plantilla JARVIS/plantillas/gitleaks.toml, SEGURIDAD.md).
# Reglas por defecto + reglas propias. Los falsos positivos ya revisados van en .gitleaksignore
# (huella del hallazgo: commit, archivo, regla y línea; nunca el secreto).
[extend]
useDefault = true

[[rules]]
id = "anthropic-cualquier-prefijo"
description = "Clave o token de Anthropic de cualquier tipo. La regla por defecto solo ve sk-ant-api03 y sk-ant-admin01, y se le escapó una sk-ant-usr filtrada el 16/10/2026"
regex = '''\bsk-ant-[a-z]{2,8}[0-9]{0,2}-[A-Za-z0-9_\-]{20,}'''
keywords = ["sk-ant-"]

[[rules]]
id = "telegram-bot-token"
description = "Token de bot de Telegram"
regex = '''\b[0-9]{8,10}:AA[0-9A-Za-z_\-]{33}\b'''
keywords = [":AA"]
